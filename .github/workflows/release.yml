name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Matrix Standalone Binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/curate-linux-amd64 ./cmd/curate
          tar -czf dist/curate_${{ github.ref_name }}_linux_amd64.tar.gz -C dist curate-linux-amd64
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/curate-linux-arm64 ./cmd/curate
          tar -czf dist/curate_${{ github.ref_name }}_linux_arm64.tar.gz -C dist curate-linux-arm64
          
          # macOS Darwin AMD64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/curate-darwin-amd64 ./cmd/curate
          tar -czf dist/curate_${{ github.ref_name }}_darwin_amd64.tar.gz -C dist curate-darwin-amd64
          
          # macOS Darwin ARM64 (Apple Silicon M-series)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/curate-darwin-arm64 ./cmd/curate
          tar -czf dist/curate_${{ github.ref_name }}_darwin_arm64.tar.gz -C dist curate-darwin-arm64
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/curate.exe ./cmd/curate
          zip -j dist/curate_${{ github.ref_name }}_windows_amd64.zip dist/curate.exe
          
          # Generate SHA256 checksums
          cd dist
          sha256sum curate_${{ github.ref_name }}_*.tar.gz curate_${{ github.ref_name }}_*.zip > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/curate_${{ github.ref_name }}_linux_amd64.tar.gz
            dist/curate_${{ github.ref_name }}_linux_arm64.tar.gz
            dist/curate_${{ github.ref_name }}_darwin_amd64.tar.gz
            dist/curate_${{ github.ref_name }}_darwin_arm64.tar.gz
            dist/curate_${{ github.ref_name }}_windows_amd64.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
